version: 2
updates:
  # ── NuGet 依赖 ──
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 10
    ignore:
      # Avalonia.Headless.XUnit 12.1.4 仍按 xunit.v3.extensibility.core 3.2.2 编译，
      # xunit.v3 4.x 会在用例发现阶段抛 MissingMethodException；
      # Presentation.Tests 锁定 3.2.2，故忽略 xunit.v3 的主版本升级，待 Avalonia 适配后移除。
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
    groups:
      # Avalonia 系列版本必须同步，放一组
      avalonia:
        patterns:
          - Avalonia
          - Avalonia.Desktop
          - Avalonia.Browser
          - Avalonia.Headless
          - Avalonia.Themes.Fluent
          - Avalonia.Fonts.Inter
          - AvaloniaUI.DiagnosticsSupport
      # xUnit 测试栈放一组
      xunit:
        patterns:
          - xunit.v3
          - xunit.runner.visualstudio
          - Microsoft.NET.Test.Sdk
      # Microsoft.Extensions 系列放一组
      ms-extensions:
        patterns:
          - Microsoft.Extensions.*
      # Serilog 相关放一组
      serilog:
        patterns:
          - Serilog
          - Serilog.Extensions.Logging
          - Serilog.Sinks.File
          - Serilog.Enrichers.Thread
      # 其余 NuGet 自动归入 catch-all 组
      nuget:
        patterns:
          - "*"

  # ── GitHub Actions ──
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
