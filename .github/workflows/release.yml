name: Release SeatFlow

on:
  push:
    branches: ['main']
    paths: ['version.json']
  workflow_dispatch:
    inputs:
      version:
        description: '发布版本号（覆盖 version.json，如 2.0.1）'
        required: true
        type: string
      suffix:
        description: '可选后缀（如 beta.1 / rc），自动设为 pre-release'
        required: false
        type: string
        default: ''

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  PROJECT_PATH: 'src/SeatFlow.Desktop'
  CONFIGURATION: 'Release'

permissions:
  contents: read

concurrency: release-${{ github.ref }}

jobs:
  # ──────────────────────────────────────────────
  # Job 0: 版本预检（独立执行，先行于构建）
  #   - tag 不得已存在
  #   - 版本必须大于当前最新 release，否则中止（不触发构建）
  # ──────────────────────────────────────────────
  preflight:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
      is_pre: ${{ steps.version.outputs.is_pre }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install packaging

      - name: Resolve version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            SUFFIX="${{ inputs.suffix }}"
            if [ -n "$SUFFIX" ]; then V="${V}-${SUFFIX}"; fi
            echo "is_pre=true" >> "$GITHUB_OUTPUT"
            echo "Is manual release (pre-release)"
          else
            V=$(python3 -c "import json; print(json.load(open('version.json'))['version'])")
            echo "is_pre=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Version: $V"

      - name: Pre-flight checks
        run: |
          V="${{ steps.version.outputs.version }}"
          TAG="v${V}"
          echo "Target: $TAG"

          # 1. 禁止发布已存在的 Release
          if gh release view "$TAG" --repo "${{ github.repository }}" &>/dev/null; then
            echo "✗ Release $TAG already exists. Abort."
            exit 1
          fi

          # 2. 版本号必须大于当前最大 Release tag
          LATEST_TAG=$(gh release list --repo "${{ github.repository }}" -L 1 --order desc --exclude-pre-releases --json tagName -q '.[0].tagName' 2>/dev/null || echo "")
          if [[ -n "$LATEST_TAG" ]]; then
            LATEST=${LATEST_TAG#v}
            echo "Latest release: $LATEST_TAG"
            RESULT=$(python3 -c "
          from packaging.version import Version
          print('ok' if Version('$V') > Version('$LATEST') else 'fail')
          ")
            if [[ "$RESULT" == "fail" ]]; then
              echo "✗ Version $V is not greater than latest $LATEST. Abort."
              exit 1
            fi
            echo "✓ Version $V > $LATEST"
          else
            echo "No existing releases — first release, proceeding."
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  # ──────────────────────────────────────────────
  # Job 1: 多平台构建 + vpk 打包（含 delta 增量）
  # ──────────────────────────────────────────────
  build:
    needs: preflight
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: ubuntu-latest
            vpk-directive: '[win]'
            main-exe: 'SeatFlow.exe'
            icon: 'Assets/installer.ico'
            extra-args: '--noPortable'

          - rid: linux-x64
            os: ubuntu-latest
            vpk-directive: '[linux]'
            main-exe: 'SeatFlow'
            icon: 'Assets/SF_icon_mini_background.png'
            extra-args: ''

          - rid: osx-x64
            os: macos-latest
            vpk-directive: '[osx]'
            main-exe: 'SeatFlow'
            icon: 'Assets/installer.icns'
            extra-args: ''

          - rid: osx-arm64
            os: macos-latest
            vpk-directive: '[osx]'
            main-exe: 'SeatFlow'
            icon: 'Assets/installer.icns'
            extra-args: ''

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Install system dependencies (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y squashfs-tools zstd

      - name: Install system dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install zstd

      - name: Install vpk
        run: dotnet tool install -g vpk --version 1.2.161 && echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore Velopack history cache
        if: needs.preflight.outputs.is_pre != 'true'
        uses: actions/cache/restore@v6
        with:
          path: publish/history
          key: vpk-history-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vpk-history-${{ matrix.rid }}-

      - name: Install oss2
        if: needs.preflight.outputs.is_pre != 'true'
        run: pip install oss2 packaging

      - name: Sync Velopack history from OSS
        if: needs.preflight.outputs.is_pre != 'true'
        env:
          OSS_KEY_ID: ${{ secrets.OSS_KEY_ID }}
          OSS_KEY_SECRET: ${{ secrets.OSS_KEY_SECRET }}
          OSS_ENDPOINT: ${{ vars.OSS_ENDPOINT }}
          OSS_BUCKET: ${{ vars.OSS_BUCKET }}
        run: |
          python3 scripts/ci/sync_velopack_history.py \
            --channel ${{ matrix.rid }} \
            --output-dir publish/history

      - name: dotnet publish
        run: |
          dotnet publish ${{ env.PROJECT_PATH }} \
            -c ${{ env.CONFIGURATION }} \
            -r ${{ matrix.rid }} \
            --self-contained true \
            -o publish/tmp

      - name: Fetch previous release (delta base)
        if: needs.preflight.outputs.is_pre == 'true'
        shell: bash
        env:
          VPK_CHANNEL: ${{ matrix.rid }}
          UPDATE_FEED_URL: ${{ vars.UPDATE_FEED_URL }}
          OUTPUT_DIR: 'publish/out'
        run: bash scripts/ci/fetch_previous.sh

      - name: Generate macOS app icon (icns)
        if: runner.os == 'macOS'
        run: |
          # macOS --icon 是应用图标（.app/AppIcon），与 Linux 一致使用程序图标
          ICONSET="icon.iconset"
          mkdir -p "$ICONSET"
          for s in 16 32 128 256 512; do
            sips -z "$s" "$s" Assets/SF_icon_mini_background.png --out "$ICONSET/icon_${s}x${s}.png" >/dev/null
            d=$((s * 2))
            sips -z "$d" "$d" Assets/SF_icon_mini_background.png --out "$ICONSET/icon_${s}x${s}@2x.png" >/dev/null
          done
          iconutil -c icns "$ICONSET" -o Assets/installer.icns
          echo "✓ Assets/installer.icns (generated from SF_icon_mini_background.png)"

      - name: vpk pack
        shell: bash
        run: |
          # 签名参数可选：secrets 为空时不附加（跳过签名环节）
          SIGN_ARGS=()
          if [ -n "${VPK_KEY_ID:-}" ]; then SIGN_ARGS+=(--keyId "$VPK_KEY_ID"); fi
          if [ -n "${VPK_KEY_FILE:-}" ]; then SIGN_ARGS+=(--keyFile "$VPK_KEY_FILE"); fi
          if [ -n "${VPK_KEY_PASSWORD:-}" ]; then SIGN_ARGS+=(--keyPassword "$VPK_KEY_PASSWORD"); fi
          vpk ${{ matrix.vpk-directive }} pack \
            --packId SeatFlow \
            --packVersion ${{ needs.preflight.outputs.version }} \
            --packDir publish/tmp \
            --mainExe ${{ matrix.main-exe }} \
            --runtime ${{ matrix.rid }} \
            --channel ${{ matrix.rid }} \
            --outputDir "$VPK_OUTPUT_DIR" \
            --packTitle "SeatFlow" \
            --packAuthors "Helio-RC" \
            --icon ${{ matrix.icon }} \
            --delta BestSpeed \
            ${{ matrix.extra-args }} \
            "${SIGN_ARGS[@]}"
        env:
          VPK_KEY_ID: ${{ secrets.VPK_KEY_ID }}
          VPK_KEY_FILE: ${{ secrets.VPK_KEY_FILE }}
          VPK_KEY_PASSWORD: ${{ secrets.VPK_KEY_PASSWORD }}
          VPK_OUTPUT_DIR: ${{ needs.preflight.outputs.is_pre == 'true' && 'publish/out' || 'publish/history' }}

      - name: Stage release artifacts
        shell: bash
        env:
          VPK_OUTPUT_DIR: ${{ needs.preflight.outputs.is_pre == 'true' && 'publish/out' || 'publish/history' }}
        run: |
          bash scripts/ci/stage_velopack_artifacts.sh \
            "$VPK_OUTPUT_DIR" publish/dist \
            "${{ needs.preflight.outputs.version }}" \
            "${{ matrix.rid }}" \
            "${{ needs.preflight.outputs.is_pre }}"

      - name: Save Velopack history cache
        if: needs.preflight.outputs.is_pre != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: publish/history
          key: vpk-history-${{ matrix.rid }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: publish/dist/*
          if-no-files-found: error
