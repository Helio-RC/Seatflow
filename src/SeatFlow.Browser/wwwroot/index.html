<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <title>SeatFlow - 智能排座系统</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="stylesheet" href="./app.css" />
</head>

<body>
<div id="out">
    <!-- 启动加载页：Avalonia 接管渲染时由运行时添加 splash-close 类隐藏（AvaloniaView 约定），
         类名 avalonia-splash 不可改；进度文案由 main.js（navigator.language）本地化 -->
    <div id="avalonia-splash" class="avalonia-splash" data-state="loading">
        <div class="sf-splash-card">
            <img class="sf-splash-logo" src="./icon.png" alt="" width="72" height="72" />
            <h1 class="sf-splash-title">SeatFlow <span class="sf-splash-cn">座流</span></h1>
            <p class="sf-splash-status" id="sfStatus" role="status" aria-live="polite">正在加载 SeatFlow…</p>
            <div class="sf-splash-track" id="sfTrack" role="progressbar" aria-label="加载进度"
                 aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                <div class="sf-splash-bar" id="sfBar"></div>
            </div>
            <p class="sf-splash-hint" id="sfHint">首次打开需要下载约 18 MB 应用资源，之后访问将直接从缓存秒开</p>
            <p class="sf-splash-credit">Powered by
                <a href="https://www.avaloniaui.net/" target="_blank" rel="noopener">Avalonia</a> · .NET
            </p>
        </div>
    </div>
</div>
<script type='module' src="./main.js"></script>
</body>

</html>
